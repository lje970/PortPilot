; PortPilot G3 · ESP32-S3 满速灌流(PlatformIO 工程)
; VS Code PlatformIO: 打开本目录 -> 侧栏 Platform -> Upload
; 板型 esp32-s3-devkitc-1 适配常见 S3 DevKitC/WeAct/YD 款;
; 若 Upload 报 Flash 大小错误,告诉我具体板型/Flash 容量,改 board_build 参数即可
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 显式锁定上传端口:COM9 是 CH340 模块,COM10 才是 S3 板载 USB(否则 PIO 会自动选错)
upload_port = COM10
