; PortPilot P1 · ESP32-S3 JustFloat 示波器信号源(PlatformIO)
; 2 通道正弦波 100Hz 帧率,验证示波器面板
; 接线同 flood:模块 TXD -> GPIO18(RX,可选),模块 RXD -> GPIO17(TX),GND 共地
; 注意:JustFloat 只需 PC 收,S3 TX(GPIO17)-> 模块 RXD 是必须接的一根
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM11

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
