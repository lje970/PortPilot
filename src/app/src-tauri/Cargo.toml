[package]
name = "portpilot-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
encoding_rs = "0.8"
regex = "1"
portpilot-core = { path = "../../crates/portpilot-core" }
portpilot-rtt = { path = "../../crates/portpilot-rtt" }

[profile.release]
strip = true
