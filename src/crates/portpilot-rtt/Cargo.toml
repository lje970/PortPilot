[package]
name = "portpilot-rtt"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PortPilot RTT 传输:probe-rs 调试探针直读目标机 RTT 通道(P3)"

[dependencies]
probe-rs = "0.32"
nusb = "0.1"
env_logger = "0.11"
portpilot-core = { path = "../portpilot-core" }
probe-rs-espressif = "0.32.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "probe-list"
path = "src/main.rs"
